[project]
name = "jobghost"
version = "0.1.0"
description = "Local AI job copilot controlled by Codex over MCP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116", "uvicorn[standard]>=0.35", "pydantic-settings>=2.10",
  "sqlalchemy[asyncio]>=2.0.41", "aiosqlite>=0.21", "asyncpg>=0.30",
  "alembic>=1.16", "httpx>=0.28", "apscheduler>=3.11", "mcp>=1.12,<2",
  "keyring>=25.6", "python-multipart>=0.0.20", "qrcode[pil]>=8.2", "playwright>=1.55,<2",
  "faster-whisper>=1.2,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8.4", "pytest-asyncio>=1.0", "ruff>=0.12", "mypy>=1.16"]
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "B008"]
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
